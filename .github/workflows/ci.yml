# =============================================================================
# MONTEX ERP V5 - Pipeline CI/CD
# =============================================================================
# Executa lint, build e testes a cada push/PR nos branches principais.
# DEPLOY: feito pela integração nativa da Vercel com o GitHub (auto-deploy do
# branch main). O job de deploy via amondnet/vercel-action foi removido por ser
# redundante e por falhar (npx exit 1) — ver docs/PLANO-CORRECAO-CI.md.
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  # Opt-in para o runtime Node.js 24 das actions (Node 20 é descontinuado
  # em 16/06/2026). Inofensivo se o runner ignorar.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # =========================================================================
  # JOB 1: Lint & Build
  # =========================================================================
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # =========================================================================
  # JOB 2: Testes
  # =========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://fake-test.supabase.co
          VITE_SUPABASE_ANON_KEY: fake-anon-key-for-testing
